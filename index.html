<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audition Result Check</title><style>:root{--primary:#2563eb;--primary-shadow:rgba(37, 99, 235, 0.2);--success:#2ecc71;--error:#e74c3c;--bg:#f4f7f9;--card:#ffffff;--text:#1e293b}body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:15px;display:flex;justify-content:center}.auth-card{width:100%;max-width:440px;background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:32px 26px;margin-top:40px;box-sizing:border-box}.auth-title{margin:0 0 8px 0;font-size:22px;color:var(--text)}.auth-desc{margin:0 0 22px 0;font-size:13px;color:#64748b;line-height:1.6}.auth-input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:2px solid #e2e8f0;font-size:15px;font-family:monospace;letter-spacing:.5px;margin-bottom:14px;outline:0;transition:.2s}.auth-input:focus{border-color:var(--primary)}.auth-error{color:#991b1b;background:#fef2f2;border:1px solid #fecaca;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.5}.auth-hint{margin-top:14px;font-size:12px;color:#94a3b8;text-align:center}.btn{padding:14px;border:none;border-radius:10px;cursor:pointer;font-weight:600;color:#fff;width:100%;transition:.3s;font-size:16px}.btn:disabled{opacity:.6;cursor:not-allowed}.btn-primary{background:var(--primary);box-shadow:0 4px 12px var(--primary-shadow)}.btn-secondary{background:#edf2f7;color:#4a5568;margin-top:10px}.hidden{display:none!important}</style></head><body><div id="auth-gate" class="auth-card"><div id="auth-loading" style="text-align:center;color:#64748b;font-size:14px">正在初始化查询服务...</div><div id="auth-form" class="hidden"><h2 class="auth-title">Audition Result Check</h2><p class="auth-desc">欢迎使用面试结果查询系统。请输入您的面试 ID（Audition ID）以解锁并查看面试结果。</p><input type="text" id="auth-input" class="auth-input" placeholder="请输入您的面试 ID" autocomplete="off" spellcheck="false"><div id="auth-error" class="auth-error hidden"></div><button id="auth-submit" class="btn btn-primary">查询并解锁</button><div class="auth-hint">仅限候选人本人凭面试 ID 查询本次评审结果</div></div></div><script src="app.b2ad4595.js"></script></body></html>
